name: Rotina Diaria - Extracao de Atos

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      escola:
        description: 'Código da ETEC para extrair (ou TODAS)'
        required: false
        default: 'TODAS'

# Permissão para o bot salvar a planilha no repositório
permissions:
  contents: write

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CACHE DO CHROMIUM: Reutiliza o navegador em segundos em vez de baixar 300MB toda vez
      - name: Cache dos binarios do Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar o Robo de Extracao
        env:
          URL_GOOGLE_PLANILHA: ${{ secrets.URL_GOOGLE_PLANILHA }}
        run: |
          python extrair_atos.py "${{ github.event.inputs.escola }}"

      - name: Salvar planilha atualizada no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Atos_Instituicoes_MatoGrosso.xlsx
          git diff --staged --quiet || (git commit -m "Auto: Planilha atualizada [skip ci]" && git push)
