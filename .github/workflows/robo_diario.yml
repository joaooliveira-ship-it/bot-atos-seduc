name: Rotina Diaria - Extracao de Atos SEDUC-MT

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas e dependencias do Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar o Robô de Extração
        run: |
          python extrair_atos.py

      - name: Salvar planilha atualizada no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Atos_Instituicoes_MatoGrosso.xlsx
          git diff --staged --quiet || (git commit -m "Auto: Planilha atualizada [skip ci]" && git push)
